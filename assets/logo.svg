<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="100%" height="100%">
  <defs>
    <!-- Globe Gradient -->
    <radialGradient id="globeSphere" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#033A6B" />
      <stop offset="100%" stop-color="#041B38" />
    </radialGradient>

    <!-- Upward Growth Arrow Gradient -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="50%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>

    <!-- Tech Orange Gradient -->
    <linearGradient id="techTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA100" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- Volumetric M Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="glowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#FF5500" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Volumetric Emblem (Globe + Stylized M + Growth Swoosh + Currencies) -->
  <g transform="translate(15, 6)">
    <!-- Outer Glow Rim -->
    <circle cx="54" cy="54" r="50" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.4" filter="url(#glowGlow)" />
    
    <!-- 3D Globe Sphere -->
    <circle cx="54" cy="54" r="48" fill="url(#globeSphere)" />

    <!-- Globe Grid Latitude & Longitude / Data Lines -->
    <path d="M 12 54 A 42 42 0 0 1 96 54" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6" />
    <path d="M 20 34 A 44 24 0 0 1 88 34" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.4" />
    <path d="M 20 74 A 44 24 0 0 0 88 74" fill="none" stroke="#0284C7" stroke-width="1.2" opacity="0.5" />
    <ellipse cx="54" cy="54" rx="26" ry="48" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.55" />
    <ellipse cx="54" cy="54" rx="12" ry="48" fill="none" stroke="#00F0FF" stroke-width="1.2" opacity="0.45" />

    <!-- Worldwide Network Nodes (Dots) -->
    <circle cx="34" cy="38" r="2.5" fill="#00F0FF" />
    <circle cx="54" cy="24" r="3" fill="#FFFFFF" filter="url(#glowGlow)" />
    <circle cx="72" cy="42" r="2.5" fill="#00F0FF" />
    <circle cx="46" cy="68" r="2.5" fill="#38BDF8" />
    <circle cx="76" cy="66" r="2" fill="#38BDF8" />
    <line x1="34" y1="38" x2="54" y2="24" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
    <line x1="54" y1="24" x2="72" y2="42" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
    <line x1="46" y1="68" x2="76" y2="66" stroke="#38BDF8" stroke-width="1" opacity="0.5" />

    <!-- Stylized Volumetric "M" Structure in Core -->
    <path d="M 28 72 L 28 34 L 42 56 L 54 38 L 66 56 L 80 34 L 80 72 L 72 72 L 72 48 L 62 64 L 54 52 L 46 64 L 36 48 L 36 72 Z"
          fill="url(#mGrad)" opacity="0.9" />

    <!-- Upward Growth Swoosh with Arrowhead (Vibrant Gold/Amber) -->
    <path d="M 10 88 Q 42 86 64 64 Q 84 44 100 18" 
          fill="none" stroke="url(#growthGrad)" stroke-width="7" stroke-linecap="round" filter="url(#arrowShadow)" />
    <polygon points="96,12 112,18 104,32" fill="#FFD600" filter="url(#glowGlow)" />

    <!-- Base Circular Support Crescent -->
    <path d="M 12 84 Q 54 110 96 84" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- 5 Multi-Currency Worldwide Badges ($ € £ ¥ ₹) -->
    <!-- USD (Blue) -->
    <g transform="translate(22, 94)">
      <circle cx="7" cy="7" r="7" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />
      <text x="7" y="11" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>
    </g>
    <!-- EUR (Green) -->
    <g transform="translate(38, 97)">
      <circle cx="7" cy="7" r="7" fill="#16A34A" stroke="#4ADE80" stroke-width="1" />
      <text x="7" y="11" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">€</text>
    </g>
    <!-- GBP (Orange) -->
    <g transform="translate(54, 98)">
      <circle cx="7" cy="7" r="7" fill="#EA580C" stroke="#FB923C" stroke-width="1" />
      <text x="7" y="11" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">£</text>
    </g>
    <!-- JPY (Crimson) -->
    <g transform="translate(70, 95)">
      <circle cx="7" cy="7" r="7" fill="#E11D48" stroke="#FB7185" stroke-width="1" />
      <text x="7" y="11" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">¥</text>
    </g>
    <!-- INR (Purple) -->
    <g transform="translate(86, 90)">
      <circle cx="7" cy="7" r="7" fill="#9333EA" stroke="#C084FC" stroke-width="1" />
      <text x="7" y="11" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹</text>
    </g>
  </g>

  <!-- Main Brand Name & Strategic Positioning Typography -->
  <g transform="translate(142, 18)">
    <!-- Main Brand Name -->
    <text x="0" y="48" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5px">
      <tspan fill="#FFFFFF">Maini</tspan><tspan fill="url(#techTextGrad)">Tech</tspan>
    </text>

    <!-- Strategic Solutions Rule Bar & Neon Cyan Subtitle -->
    <g transform="translate(2, 68)">
      <line x1="0" y1="-5" x2="45" y2="-5" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
      <text x="56" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16.5" font-weight="800" letter-spacing="4px" fill="#00F0FF" filter="url(#glowGlow)">
        STRATEGIC SOLUTIONS
      </text>
      <line x1="340" y1="-5" x2="385" y2="-5" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Sub-Pillars: IT Consultancy | Business Strategy | Global Growth -->
    <g transform="translate(2, 92)" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" letter-spacing="1px">
      <!-- Pillar 1 -->
      <circle cx="6" cy="-4" r="3.5" fill="#00F0FF" />
      <text x="16" y="0" fill="#E2E8F0">IT CONSULTANCY</text>
      
      <!-- Separator -->
      <line x1="140" y1="-8" x2="140" y2="2" stroke="#334155" stroke-width="1.5" />
      
      <!-- Pillar 2 -->
      <circle cx="156" cy="-4" r="3.5" fill="#10B981" />
      <text x="166" y="0" fill="#E2E8F0">BUSINESS STRATEGY</text>

      <!-- Separator -->
      <line x1="316" y1="-8" x2="316" y2="2" stroke="#334155" stroke-width="1.5" />

      <!-- Pillar 3 -->
      <circle cx="332" cy="-4" r="3.5" fill="#FF9900" />
      <text x="342" y="0" fill="#E2E8F0">GLOBAL GROWTH</text>
    </g>
  </g>
</svg>
